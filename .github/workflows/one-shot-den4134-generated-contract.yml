name: One-shot DEN-4134 generated-contract repair

on:
  push:
    branches:
      - rescue/DEN-4134-fleet-20260829/freeze/generated-readonly-policy-ce47f512842a

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: "${{ github.event.head_commit.message != 'test(DEN-4134): make generated schema fixtures executable' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact rescue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Reassemble, apply, and verify the non-workflow patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          encoded=/tmp/den4134-generated-contract.patch.gz.b64
          archive=/tmp/den4134-generated-contract.patch.gz
          patch_file=/tmp/den4134-generated-contract.patch

          mapfile -t chunks < <(find .github/den4134-patch -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#chunks[@]}" -ne 12 ]; then
            printf 'expected 12 patch chunks, found %s\n' "${#chunks[@]}" >&2
            exit 1
          fi
          for index in $(seq -w 0 11); do
            if [ "${chunks[$((10#$index))]}" != "$index" ]; then
              printf 'missing or unordered patch chunk %s\n' "$index" >&2
              exit 1
            fi
          done
          cat .github/den4134-patch/{00,01,02,03,04,05,06,07,08,09,10,11} > "$encoded"
          echo "52dc884bd33dc2e9bc53a5aa09700132efb571b93ef63abe6fc53265a05f4d0d  $encoded" \
            | sha256sum --check --strict
          base64 --decode "$encoded" > "$archive"
          echo "0633916cbf5023663c546e99d08645e2a38a1e9eb9fe37466a17804a85bd87f4  $archive" \
            | sha256sum --check --strict
          gzip -dc "$archive" > "$patch_file"
          echo "ce3d990ee7e37fd1d0140448fb37ca3a6e3a9f0d087facff137e260250abb18d  $patch_file" \
            | sha256sum --check --strict

          python3 - "$patch_file" <<'PY'
          from pathlib import Path
          import sys

          patch = Path(sys.argv[1]).read_text(encoding="utf-8")
          allowed_exact = {
              ".github/workflows/generated-contract.yml",
              "scripts/check-generated-contract.py",
          }
          paths = []
          for line in patch.splitlines():
              if not line.startswith("+++ b/"):
                  continue
              path = line[len("+++ b/"):]
              paths.append(path)
              if path in allowed_exact or path.startswith("tests/generated-contract/"):
                  continue
              raise SystemExit(f"unexpected patch path: {path}")
          if len(paths) != 45 or len(set(paths)) != 45:
              raise SystemExit(
                  f"expected 45 unique bounded patch paths, got {len(paths)} lines / "
                  f"{len(set(paths))} unique"
              )
          PY

          git apply --check --whitespace=error-all \
            --exclude=.github/workflows/generated-contract.yml "$patch_file"
          git apply --whitespace=error-all \
            --exclude=.github/workflows/generated-contract.yml "$patch_file"

          python3 -m pip install --quiet --disable-pip-version-check jsonschema==4.25.1
          python3 -m py_compile scripts/check-generated-contract.py
          python3 scripts/check-generated-contract.py --self-test
          python3 scripts/check-generated-contract.py --freeze --require-readonly

          python3 <<'PY'
          import subprocess

          output = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z"],
          ).decode("utf-8")
          entries = [entry for entry in output.split("\0") if entry]
          paths = [entry[3:] for entry in entries]
          for path in paths:
              if path == "scripts/check-generated-contract.py" or path.startswith(
                  "tests/generated-contract/"
              ):
                  continue
              raise SystemExit(f"unexpected changed path: {path}")
          if len(paths) != 44 or len(set(paths)) != 44:
              raise SystemExit(
                  f"expected 44 unique non-workflow changes, got {len(paths)} lines / "
                  f"{len(set(paths))} unique"
              )
          PY

          git add -- scripts/check-generated-contract.py tests/generated-contract
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(DEN-4134): make generated schema fixtures executable"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
