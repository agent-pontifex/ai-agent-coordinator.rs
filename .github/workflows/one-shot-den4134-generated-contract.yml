name: One-shot DEN-4134 generated-contract repair

on:
  push:
    branches:
      - rescue/DEN-4134-fleet-20260829/freeze/generated-readonly-policy-ce47f512842a

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact rescue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Apply bounded generated-contract repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          payload=.github/den4134-generated-contract-fix.tar.gz.b64
          archive=/tmp/den4134-generated-contract-fix.tar.gz
          base64 --decode "$payload" > "$archive"
          echo "9dc8c83dd55ba92ed243dfc49ddcecb0026c7e1c47f34dc02eca53ae800882f9  $archive" | sha256sum --check --strict

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/generated-contract.yml|scripts/check-generated-contract.py|tests/generated-contract/*) ;;
              *)
                printf 'unexpected archive path: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(tar -tzf "$archive")
          tar -xzf "$archive"

          python3 -m pip install --quiet --disable-pip-version-check jsonschema==4.25.1
          python3 -m py_compile scripts/check-generated-contract.py
          python3 scripts/check-generated-contract.py --self-test
          python3 scripts/check-generated-contract.py --freeze --require-readonly

          git rm -- "$payload" .github/workflows/one-shot-den4134-generated-contract.yml

          while IFS= read -r path; do
            case "$path" in
              .github/den4134-generated-contract-fix.tar.gz.b64|.github/workflows/one-shot-den4134-generated-contract.yml|.github/workflows/generated-contract.yml|scripts/check-generated-contract.py|tests/generated-contract/*) ;;
              *)
                printf 'unexpected changed path: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1 | cut -c4-)

          git add -- .github/workflows/generated-contract.yml scripts/check-generated-contract.py tests/generated-contract
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(DEN-4134): make generated schema fixtures executable"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
