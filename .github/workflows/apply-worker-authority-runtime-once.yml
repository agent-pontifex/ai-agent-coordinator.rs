name: apply-worker-authority-runtime-once

on:
  push:
    branches:
      - feat/den-3138-runtime-worker-authorization
    paths:
      - ".github/workflows/apply-worker-authority-runtime-once.yml"

permissions:
  contents: write

concurrency:
  group: apply-worker-authority-runtime-once
  cancel-in-progress: false

jobs:
  integrate-test-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/den-3138-runtime-worker-authorization
          fetch-depth: 0
          persist-credentials: true
      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Apply exact semantic integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

