              "use std::sync::Arc;\n",
              "use std::{env, sync::Arc};\n",
          )
          replace_once(
              "src/app.rs",
              "        ClaimJobRequest, CompleteJobRequest, CompletionOutcome, CreateJobRequest,\n        HeartbeatJobRequest,\n",
              "        ClaimJobRequest, CompleteJobRequest, CompletionOutcome, CreateJobRequest,\n        HeartbeatJobRequest, Job,\n",
          )
