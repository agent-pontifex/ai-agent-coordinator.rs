name: Deployment contract

on:
  pull_request:
    paths:
      - '.github/workflows/deployment-contract.yml'
      - 'deploy/k8s/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/deployment-contract.yml
      - name: Validate namespace-scoped manifest contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' deploy/k8s; then
            echo 'Git conflict markers are forbidden.' >&2
            exit 1
          fi
          ruby <<'RUBY'
          require 'yaml'

          root = 'deploy/k8s'
          kustomization = YAML.safe_load(File.read(File.join(root, 'kustomization.yaml')))
          expected_files = kustomization.fetch('resources').sort
          actual_files = Dir[File.join(root, '*.yaml')]
            .map { |path| File.basename(path) }
            .reject { |name| name == 'kustomization.yaml' }
            .sort
          abort "kustomization resources do not match files: #{expected_files.inspect} != #{actual_files.inspect}" unless expected_files == actual_files

          resources = actual_files.flat_map do |name|
            YAML.load_stream(File.read(File.join(root, name))).compact
          end
          abort 'ServiceAccount is platform-owned and must not be rendered by the application kustomization' if resources.any? { |resource| resource['kind'] == 'ServiceAccount' }
          allowed_kinds = %w[ConfigMap CronJob Deployment ExternalSecret Job NetworkPolicy PersistentVolumeClaim Service]
          resources.each do |resource|
            kind = resource.fetch('kind')
            abort "cluster-scoped or unexpected kind #{kind}" unless allowed_kinds.include?(kind)
            metadata = resource.fetch('metadata')
            abort "#{kind} must use ai-agent-coordinator namespace" unless metadata['namespace'] == 'ai-agent-coordinator'
          end
          abort 'plaintext Secret objects are forbidden' if resources.any? { |resource| resource['kind'] == 'Secret' }

          deployment = resources.find { |resource| resource['kind'] == 'Deployment' } or abort 'Deployment missing'
          spec = deployment.fetch('spec')
          abort 'Deployment must remain single-replica' unless spec['replicas'] == 1
          abort 'SQLite Deployment must use Recreate' unless spec.dig('strategy', 'type') == 'Recreate'
          pod_spec = spec.dig('template', 'spec')
          abort 'service account token must not be mounted' unless pod_spec['automountServiceAccountToken'] == false
          abort 'wrong tenant service account' unless pod_spec['serviceAccountName'] == 'ai-agent-coordinator'
          network_policy = resources.find { |resource| resource['kind'] == 'NetworkPolicy' } or abort 'NetworkPolicy missing'
          abort 'coordinator NetworkPolicy must enforce ingress and egress' unless network_policy.dig('spec', 'policyTypes') == %w[Ingress Egress]
          container = pod_spec.fetch('containers').find { |entry| entry['name'] == 'coordinator' } or abort 'coordinator container missing'
          image = container.fetch('image')
          image_pattern = %r{\Aghcr\.io/oresoftware/ai-agent-coordinator:sha-[0-9a-f]{40}\z}
          abort 'image must use an immutable commit SHA tag' unless image.match?(image_pattern)
          security = container.fetch('securityContext')
          abort 'privilege escalation must be disabled' unless security['allowPrivilegeEscalation'] == false
          abort 'root filesystem must be read-only' unless security['readOnlyRootFilesystem'] == true
          abort 'all capabilities must be dropped' unless security.dig('capabilities', 'drop') == ['ALL']

          env = container.fetch('env').to_h { |entry| [entry.fetch('name'), entry['value']] }
          abort 'repository administration must default disabled' unless env['GITHUB_REPOSITORY_ADMIN_ENABLED'] == 'false'
          abort 'initial allowlist must be declarative-migrations only' unless env['GITHUB_REPOSITORY_ADMIN_ALLOWED_ORGS'] == 'declarative-migrations'

          refs = container.fetch('envFrom').map { |entry| entry['secretRef'] }.compact
          core = refs.find { |ref| ref['name'] == 'ai-agent-coordinator-core' } or abort 'core secret reference missing'
          abort 'core secret must not be optional' if core['optional'] == true
          telemetry = refs.find { |ref| ref['name'] == 'ai-agent-coordinator-telemetry' } or abort 'telemetry secret reference missing'
          abort 'telemetry secret must not be optional' if telemetry['optional'] == true
          admin = refs.find { |ref| ref['name'] == 'ai-agent-coordinator-admin' } or abort 'admin secret reference missing'
          abort 'admin secret must remain optional before activation' unless admin['optional'] == true

          external_secret = resources.find { |resource| resource.dig('metadata', 'name') == 'ai-agent-coordinator-core' } or abort 'core ExternalSecret missing'
          abort 'unexpected secret store' unless external_secret.dig('spec', 'secretStoreRef', 'kind') == 'ClusterSecretStore' && external_secret.dig('spec', 'secretStoreRef', 'name') == 'dd-cluster-secrets'
          abort 'ExternalSecret target mismatch' unless external_secret.dig('spec', 'target', 'name') == 'ai-agent-coordinator-core'
          secret_keys = external_secret.dig('spec', 'data').map { |entry| entry['secretKey'] }
          abort 'only the API token belongs in the bootstrap core secret' unless secret_keys == ['COORDINATOR_API_TOKEN']

          telemetry_secret = resources.find { |resource| resource.dig('metadata', 'name') == 'ai-agent-coordinator-telemetry' && resource['kind'] == 'ExternalSecret' } or abort 'telemetry ExternalSecret missing'
          abort 'telemetry secret must use the cluster secret store' unless telemetry_secret.dig('spec', 'secretStoreRef', 'kind') == 'ClusterSecretStore' && telemetry_secret.dig('spec', 'secretStoreRef', 'name') == 'dd-cluster-secrets'
          telemetry_extract = telemetry_secret.dig('spec', 'dataFrom', 0, 'extract', 'key')
          abort 'telemetry secret must use the dedicated protected bundle' unless telemetry_extract == 'dd/remote-dev/telemetry-ticket-automation'

          telemetry_config = resources.find { |resource| resource.dig('metadata', 'name') == 'ai-agent-coordinator-telemetry' && resource['kind'] == 'ConfigMap' } or abort 'telemetry ConfigMap missing'
          telemetry_data = telemetry_config.fetch('data')
          abort 'telemetry automation must be enabled' unless telemetry_data['TELEMETRY_AUTOMATION_ENABLED'] == 'true'
          abort 'live ticket delivery must not be left in dry-run' unless telemetry_data['TELEMETRY_AUTOMATION_DRY_RUN'] == 'false'
          abort 'all three model workers are required' unless telemetry_data['TELEMETRY_MODEL_AGENT_KEYS'].split(',').length == 3
          abort 'distinct consensus reviewer is required' if telemetry_data['TELEMETRY_MODEL_AGENT_KEYS'].split(',').include?(telemetry_data['TELEMETRY_MODEL_REVIEWER_KEY'])
          abort 'ordered nightly providers must be Gemini, Claude, then Codex' unless telemetry_data['TELEMETRY_REMEDIATION_PROVIDERS'] == 'gemini-sdk,claude-sdk,openai-codex-cli'
          base_branches = telemetry_data.fetch('TELEMETRY_BASE_BRANCH_MAP').split(',').map(&:strip).to_h { |entry| entry.split('=', 2) }
          abort 'chat-vibe remediation must branch from dev4' unless base_branches['oresoftware/chat.vibe'] == 'dev4'

          cronjobs = resources.select { |resource| resource['kind'] == 'CronJob' }
          delivery = cronjobs.find { |resource| resource.dig('metadata', 'name') == 'ai-agent-coordinator-telemetry-delivery' } or abort 'telemetry delivery CronJob missing'
          nightly = cronjobs.find { |resource| resource.dig('metadata', 'name') == 'ai-agent-coordinator-telemetry-nightly' } or abort 'telemetry nightly CronJob missing'
          expected_curl_image = 'curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40'
          cronjobs.each do |cronjob|
            image = cronjob.dig('spec', 'jobTemplate', 'spec', 'template', 'spec', 'containers', 0, 'image')
            abort "#{cronjob.dig('metadata', 'name')} must pin the approved curl image digest" unless image == expected_curl_image
          end
          abort 'delivery CronJob must forbid overlap' unless delivery.dig('spec', 'concurrencyPolicy') == 'Forbid'
          abort 'nightly remediation must run at 04:00 Eastern' unless nightly.dig('spec', 'schedule') == '0 4 * * *' && nightly.dig('spec', 'timeZone') == 'America/New_York'
          abort 'nightly CronJob must forbid overlap' unless nightly.dig('spec', 'concurrencyPolicy') == 'Forbid'

          jobs = resources.select { |resource| resource['kind'] == 'Job' }
          abort 'only the exact meta-agent repository bootstrap Job is permitted' unless jobs.length <= 1
          if (bootstrap = jobs.first)
            abort 'unexpected bootstrap Job name' unless bootstrap.dig('metadata', 'name') == 'meta-agent-control-plane-repository-bootstrap-20260731'
            abort 'bootstrap Job must use batch/v1' unless bootstrap['apiVersion'] == 'batch/v1'
            job_spec = bootstrap.fetch('spec')
            abort 'bootstrap Job must not retry' unless job_spec['backoffLimit'] == 0
            abort 'bootstrap Job must have a five-minute active deadline' unless job_spec['activeDeadlineSeconds'] == 300
            job_pod = job_spec.dig('template', 'spec')
            abort 'bootstrap Job must not mount a service account token' unless job_pod['automountServiceAccountToken'] == false
            abort 'bootstrap Job must never restart' unless job_pod['restartPolicy'] == 'Never'
            pod_security = job_pod.fetch('securityContext')
            abort 'bootstrap Job must run as non-root' unless pod_security['runAsNonRoot'] == true
            abort 'bootstrap Job must use UID/GID 10001' unless pod_security['runAsUser'] == 10001 && pod_security['runAsGroup'] == 10001
            abort 'bootstrap Job must use RuntimeDefault seccomp' unless pod_security.dig('seccompProfile', 'type') == 'RuntimeDefault'
            job_containers = job_pod.fetch('containers')
            abort 'bootstrap Job must have exactly one container' unless job_containers.length == 1
            job_container = job_containers.first
            abort 'unexpected bootstrap container name' unless job_container['name'] == 'create-repository'
            abort 'bootstrap Job must pin the approved curl image digest' unless job_container['image'] == expected_curl_image
            job_security = job_container.fetch('securityContext')
            abort 'bootstrap Job must disable privilege escalation' unless job_security['allowPrivilegeEscalation'] == false
            abort 'bootstrap Job root filesystem must be read-only' unless job_security['readOnlyRootFilesystem'] == true
            abort 'bootstrap Job must drop all capabilities' unless job_security.dig('capabilities', 'drop') == ['ALL']
            job_env = job_container.fetch('env')
            abort 'bootstrap Job must mount only one environment variable' unless job_env.length == 1
            token_ref = job_env.first
            abort 'bootstrap Job must use the repository-admin variable name' unless token_ref['name'] == 'GITHUB_REPOSITORY_ADMIN_TOKEN'
            secret_ref = token_ref.dig('valueFrom', 'secretKeyRef')
            abort 'bootstrap Job must use the optional coordinator admin Secret' unless secret_ref == {
              'name' => 'ai-agent-coordinator-admin',
              'key' => 'GITHUB_REPOSITORY_ADMIN_TOKEN'
            }
            abort 'bootstrap Job command must be a fail-closed shell' unless job_container['command'] == ['/bin/sh', '-ec']
            script = job_container.fetch('args').join("\n")
            required_fragments = [
              "target='meta-agents-demo/meta-agent-control-plane.rs'",
              '/user/memberships/orgs/meta-agents-demo',
              '"login"[[:space:]]*:[[:space:]]*"ORESoftware"',
              '"role"[[:space:]]*:[[:space:]]*"admin"',
              '"state"[[:space:]]*:[[:space:]]*"active"',
              '"visibility":"public"',
              '"auto_init":true',
              'status=failed stage=create',
              'status=failed stage=verify'
            ]
            missing = required_fragments.reject { |fragment| script.include?(fragment) }
            abort "bootstrap Job script is missing required guards: #{missing.inspect}" unless missing.empty?
            mounts = job_container.fetch('volumeMounts')
            abort 'bootstrap Job must mount only the in-memory temporary volume' unless mounts == [{ 'name' => 'tmp', 'mountPath' => '/tmp' }]
            volumes = job_pod.fetch('volumes')
            abort 'bootstrap Job temporary storage must be an 8Mi memory volume' unless volumes == [{
              'name' => 'tmp',
              'emptyDir' => { 'medium' => 'Memory', 'sizeLimit' => '8Mi' }
            }]
          end

          pvc = resources.find { |resource| resource['kind'] == 'PersistentVolumeClaim' } or abort 'PVC missing'
          abort 'PVC must request ReadWriteOnce' unless pvc.dig('spec', 'accessModes') == ['ReadWriteOnce']
          RUBY
      - name: Authenticate to GHCR with read-only package access
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull and smoke-test immutable image
        shell: bash
        env:
          COORDINATOR_API_TOKEN: deployment-contract-token
        run: |
          set -euo pipefail
          IMAGE_REF=$(ruby -ryaml -e "puts YAML.safe_load(File.read('deploy/k8s/deployment.yaml')).dig('spec', 'template', 'spec', 'containers', 0, 'image')")
          readonly IMAGE_REF
          docker pull "$IMAGE_REF"
          container=ai-agent-coordinator-deployment-contract
          cleanup() {
            docker logs "$container" || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /app/data:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700 \
            --publish 127.0.0.1:18080:8080 \
            --env COORDINATOR_API_TOKEN \
            --env GITHUB_REPOSITORY_ADMIN_ENABLED=false \
            --env GITHUB_REPOSITORY_ADMIN_ALLOWED_ORGS=declarative-migrations \
            "$IMAGE_REF"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo 'published coordinator image did not become ready' >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null
          response=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COORDINATOR_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"organization":"declarative-migrations","name":"declarative-migrations-monorepo","visibility":"private","initialization":"readme"}' \
            http://127.0.0.1:18080/v1/github/repositories)
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os

          repository = json.loads(os.environ['RESPONSE'])['repository']
          assert repository['dry_run'] is True
          assert repository['created'] is False
          assert repository['full_name'] == 'declarative-migrations/declarative-migrations-monorepo'
          PY
