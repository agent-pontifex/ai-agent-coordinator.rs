name: Temporary rustls lock repair
on:
  push:
    branches:
      - formal/multi-method-wave6-20260925
    paths:
      - .github/workflows/temp-rustls-lock-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: formal/multi-method-wave6-20260925
      - name: Resolve patched rustls graph
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.45
          grep -A3 '^name = "rustls"$' Cargo.lock | grep 'version = "0.23.45"'
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Cargo.lock').read_text()
          assert 'name = "rustls"\nversion = "0.23.45"' in text
          assert 'name = "rustls-webpki"\nversion = "0.103.13"' not in text
          PY
      - name: Commit lockfile-only repair
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- . ':!.github/workflows/temp-rustls-lock-repair.yml' | grep -v '^ M Cargo.lock$' || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: resolve rustls RUSTSEC-2026-0285'
          git push origin HEAD:formal/multi-method-wave6-20260925
