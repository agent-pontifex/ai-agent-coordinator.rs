name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
# Runs with NO age key on purpose; all assertions are key-independent.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinator-secrets-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  env-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned just
        env:
          JUST_VERSION: 1.51.0
          JUST_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 5 --fail --location --silent --show-error \
            -o "$archive" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$JUST_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          test "$(just --version)" = "just ${JUST_VERSION}"

      - name: just env-check
        run: just env-check
