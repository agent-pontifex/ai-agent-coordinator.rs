name: format-worker-authority-once

on:
  push:
    branches:
      - feat/den-3138-worker-authority-v2
    paths:
      - "src/worker_authority.rs"
      - "src/lib.rs"
      - ".github/workflows/format-worker-authority-once.yml"

permissions:
  contents: write

concurrency:
  group: format-worker-authority-once
  cancel-in-progress: false

jobs:
  format-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out only the reviewed feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/den-3138-worker-authority-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Canonically format the protected-worker contract
        run: cargo fmt --all
      - name: Commit explicit files and remove this one-shot carrier
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/worker_authority.rs src/lib.rs
          git rm -- .github/workflows/format-worker-authority-once.yml
          git diff --cached --check
          git commit -m 'style(DEN-3138): apply canonical Rust formatting'
          git push origin HEAD:refs/heads/feat/den-3138-worker-authority-v2
