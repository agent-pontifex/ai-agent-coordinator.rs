name: Run DEN-877 finalizer on reopened PR

on:
  pull_request:
    types: [reopened, synchronize]
    branches:
      - main
    paths:
      - .github/workflows/finalize-den-877-semantic-merge.yml
      - .github/workflows/run-finalize-den877-on-pr.yml

permissions:
  contents: write

concurrency:
  group: run-finalize-den877-on-pr
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'ORESoftware/ai-agent-coordinator.rs' &&
      github.event.pull_request.head.repo.full_name ==
        'ORESoftware/ai-agent-coordinator.rs' &&
      github.head_ref == 'agent/den-877-fleet-merge-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact reconciliation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-877-fleet-merge-repair
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Execute the audited finalizer blocks in order
        shell: bash
        env:
          FINALIZER_PARENT: feb1bca74a94a68d0d0bc243913a25f43af2e9a3
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          finalizer = Path('.github/workflows/finalize-den-877-semantic-merge.yml')
          wrapper = Path('.github/workflows/run-finalize-den877-on-pr.yml')
          lines = finalizer.read_text(encoding='utf-8').splitlines()
          scripts: list[str] = []
          index = 0
          while index < len(lines):
              if lines[index] != '        run: |':
                  index += 1
                  continue
              index += 1
              block: list[str] = []
              while index < len(lines):
                  line = lines[index]
                  if line and len(line) - len(line.lstrip(' ')) <= 8:
                      break
                  block.append(line[10:] if line.startswith('          ') else '')
                  index += 1
              scripts.append('\n'.join(block) + '\n')

          if len(scripts) != 3:
              raise SystemExit(f'expected exactly three audited shell blocks, found {len(scripts)}')

          old_parent = "expected_parent='4f958d51e25633e081cbb9802299e2b256f08733'"
          new_parent = f"expected_parent='{os.environ['FINALIZER_PARENT']}'"
          if scripts[0].count(old_parent) != 1:
              raise SystemExit('audited finalizer parent guard drifted')
          scripts[0] = scripts[0].replace(old_parent, new_parent, 1)

          environment = os.environ.copy()
          workflow_paths = [
              '.github/workflows/repository-fleets.yml',
              '.github/workflows/finalize-den-877-semantic-merge.yml',
              '.github/workflows/hypesiege-streempilot-device-publish-temporary.yml',
              '.github/workflows/run-finalize-den877-on-pr.yml',
          ]
          for position, script in enumerate(scripts, start=1):
              if position == 3:
                  subprocess.run(
                      ['git', 'checkout', 'HEAD', '--', *workflow_paths],
                      check=True,
                      env=environment,
                  )
                  changed_workflows = subprocess.run(
                      ['git', 'diff', '--name-only', '--', '.github/workflows'],
                      check=True,
                      text=True,
                      stdout=subprocess.PIPE,
                      env=environment,
                  ).stdout.strip()
                  if changed_workflows:
                      raise SystemExit(
                          f'workflow changes leaked into Actions push: {changed_workflows}'
                      )
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', script],
                  check=True,
                  env=environment,
              )
          PY
