name: one-shot pin runner labels

on:
  push:
    branches:
      - hardening/workflow-policy-20260930

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Replace only moving hosted-runner aliases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          mapping = {
              'ubuntu-latest': 'ubuntu-24.04',
              'macos-latest': 'macos-15',
              'windows-latest': 'windows-2025',
          }
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              if path.name == 'one-shot-pin-runners.yml':
                  continue
              text = path.read_text()
              updated = text
              for old, new in mapping.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY
      - name: Remove helper and commit runner pins
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-pin-runners.yml
          git add .github/workflows
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: pin hosted runner images'
          git push origin HEAD:hardening/workflow-policy-20260930
