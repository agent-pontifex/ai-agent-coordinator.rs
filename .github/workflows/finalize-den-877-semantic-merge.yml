      - name: Prove the reconciled fleet contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py
          python -m unittest -v scripts/test_publish_hypesiege_streempilot_fleet.py

          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository hypesiege/hypesiege-api-server.rs \
            > "$RUNNER_TEMP/hypesiege-plan.json"
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository streempilot/streempilot-monorepo \
            > "$RUNNER_TEMP/streempilot-plan.json"

          stale_digest='50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1''f'
          if grep -RInF "$stale_digest" \
            docs/hypesiege-streempilot-repository-publication.md \
            repository-fleets/hypesiege-streempilot.json \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py; then
            echo 'stale generator identity remains' >&2
            exit 1
          fi
          if grep -RInE \
            '9fb1ba2a57a7509be162ec1ca4eeb794ec910bbb|0e83a0dfa1c2f5c4a20c50c8b6f7d1453a24cc07' \
            .github/workflows/repository-fleets.yml \
            repository-fleets/hypesiege-streempilot.json \
            scripts/test_publish_hypesiege_streempilot_fleet.py; then
            echo 'stale monorepo identity remains' >&2
            exit 1
          fi
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- \
            .github/workflows/repository-fleets.yml \
            docs/hypesiege-streempilot-repository-publication.md \
            repository-fleets/hypesiege-streempilot.json \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py; then
            echo 'conflict markers remain' >&2
            exit 1
          fi
          test ! -e deploy/k8s/bootstrap
          test ! -e repository-fleets/hypesiege-streempilot/RECONCILE-TRIGGER-20260731
          test ! -e .github/workflows/hypesiege-streempilot-device-publish-temporary.yml
          test ! -e .github/workflows/finalize-den-877-semantic-merge.yml
          if find .github/workflows -maxdepth 1 -type f \
            \( -name '*den-877*' -o -name 'hypesiege-streempilot-device-*' \) \
            -print -quit | grep -q .; then
            echo 'temporary fleet-repair workflow remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit the deep semantic merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git commit -m 'fix(DEN-877): preserve deterministic two-stage fleet histories'
          git push origin HEAD:agent/den-877-fleet-merge-repair
