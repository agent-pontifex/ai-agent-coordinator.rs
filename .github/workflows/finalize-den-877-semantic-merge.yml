name: Finalize DEN-877 semantic fleet merge

on:
  push:
    branches:
      - agent/den-877-fleet-merge-repair
    paths:
      - .github/workflows/finalize-den-877-semantic-merge.yml

permissions:
  contents: write

concurrency:
  group: finalize-den-877-semantic-merge
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'ORESoftware/ai-agent-coordinator.rs' &&
      github.ref == 'refs/heads/agent/den-877-fleet-merge-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
