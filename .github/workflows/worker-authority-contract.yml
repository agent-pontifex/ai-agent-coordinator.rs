name: worker-authority-contract

on:
  pull_request:
    paths:
      - "src/worker_authority.rs"
      - "src/jobs.rs"
      - "src/lib.rs"
      - "docs/protected-worker-authority.md"
      - ".github/workflows/worker-authority-contract.yml"
  push:
    branches: [dev, main]
    paths:
      - "src/worker_authority.rs"
      - "src/jobs.rs"
      - "src/lib.rs"
      - "docs/protected-worker-authority.md"
      - ".github/workflows/worker-authority-contract.yml"

permissions:
  contents: read

concurrency:
  group: worker-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the repository's pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Compile every target and feature with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run protected-worker adversarial tests
        run: cargo test --locked --all worker_authority
      - name: Prove locked resolution is immutable
        run: git diff --exit-code -- Cargo.lock
