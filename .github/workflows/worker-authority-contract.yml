name: worker-authority-contract

on:
  pull_request:
    paths:
      - "src/worker_authority.rs"
      - "src/jobs.rs"
      - "src/lib.rs"
      - ".github/workflows/worker-authority-contract.yml"
  push:
    branches: [dev, main]
    paths:
      - "src/worker_authority.rs"
      - "src/jobs.rs"
      - "src/lib.rs"
      - ".github/workflows/worker-authority-contract.yml"

permissions:
  contents: read

concurrency:
  group: worker-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Compile every target with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run protected-worker adversarial tests
        run: cargo test --locked --all-targets worker_authority
      - name: Prove locked resolution is immutable
        run: git diff --exit-code -- Cargo.lock
