name: One-shot chacha20 lock refresh

on:
  push:
    branches:
      - fix/chacha20-0.10.2-lock

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Replace and compile the exact chacha20 lock block
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import subprocess

          path = Path("Cargo.lock")
          text = path.read_text(encoding="utf-8")
          old_checksum = "d524456ba66e72eb8b115ff89e01e497f8e6d11d78b70b1aa13c0fbd97540a81"
          new_checksum = "65c35e4b699c7e15ccbe7ee35c005e4fc0a278d22238a2857e6ce2dadeda1b06"
          old = f'''[[package]]
          name = "chacha20"
          version = "0.10.1"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "{old_checksum}"
          dependencies = [
           "cfg-if",
           "cpufeatures 0.3.0",
           "rand_core 0.10.1",
          ]
          '''
          new = old.replace('version = "0.10.1"', 'version = "0.10.2"').replace(
              old_checksum, new_checksum
          )
          if text.count(old) != 1:
              raise SystemExit("expected exactly one reviewed chacha20 0.10.1 package block")
          path.write_text(text.replace(old, new), encoding="utf-8")

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "--", "Cargo.lock"],
              text=True,
          )
          changed = [
              line
              for line in diff.splitlines()
              if line.startswith(("+", "-"))
              and not line.startswith(("+++", "---"))
          ]
          expected = Counter(
              [
                  '-version = "0.10.1"',
                  f'-checksum = "{old_checksum}"',
                  '+version = "0.10.2"',
                  f'+checksum = "{new_checksum}"',
              ]
          )
          if Counter(changed) != expected:
              raise SystemExit("lock repair changed more than the reviewed version/checksum pair")
          PY

          cargo check --locked --all-targets --all-features

          git rm -- .github/workflows/one-shot-chacha20-lock.yml

          while IFS= read -r path; do
            case "$path" in
              Cargo.lock|.github/workflows/one-shot-chacha20-lock.yml) ;;
              *)
                printf 'unexpected changed path: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1 | cut -c4-)

          git add -- Cargo.lock
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: replace yanked chacha20 0.10.1 lock entry"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
