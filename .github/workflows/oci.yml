name: OCI

on:
  pull_request:
    paths:
      - '.github/workflows/oci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'coordinator.example.yaml'
      - 'scripts/test-oci-workflow.py'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'coordinator.example.yaml'
      - 'scripts/test-oci-workflow.py'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-agent-coordinator

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify registry ownership and publish guards
        run: python3 scripts/test-oci-workflow.py
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/oci.yml
      - name: Build image
        run: docker build --pull --tag "coordinator-ci:${GITHUB_SHA}" .
      - name: Smoke-test locked-down container
        shell: bash
        env:
          COORDINATOR_API_TOKEN: ci-coordinator-token
        run: |
          set -euo pipefail
          container=ai-agent-coordinator-ci
          database=ai-agent-coordinator-ci-postgres
          network=ai-agent-coordinator-ci
          cleanup() {
            docker logs "$container" || true
            docker logs "$database" || true
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker rm --force "$database" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run --detach \
            --name "$database" \
            --network "$network" \
            --env POSTGRES_PASSWORD=coordinator-ci \
            --env POSTGRES_DB=coordinator \
            postgres:17
          for attempt in $(seq 1 60); do
            if docker exec "$database" pg_isready --username postgres --dbname coordinator >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo 'PostgreSQL did not become ready' >&2
              exit 1
            fi
            sleep 1
          done

          docker run --detach \
            --name "$container" \
            --network "$network" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:18080:8080 \
            --env COORDINATOR_API_TOKEN \
            --env AI_AGENT_COORDINATOR_DATABASE_URL=postgres://postgres:coordinator-ci@ai-agent-coordinator-ci-postgres:5432/coordinator \
            --env GITHUB_REPOSITORY_ADMIN_ALLOWED_ORGS=declarative-migrations \
            "coordinator-ci:${GITHUB_SHA}"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo 'coordinator did not become ready' >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/v1/models)
          test "$status" = 401

          response=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COORDINATOR_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"organization":"declarative-migrations","name":"declarative-migrations-monorepo","visibility":"private","initialization":"readme"}' \
            http://127.0.0.1:18080/v1/github/repositories)
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ['RESPONSE'])['repository']
          assert payload['dry_run'] is True
          assert payload['created'] is False
          assert payload['existing'] is False
          assert payload['full_name'] == 'declarative-migrations/declarative-migrations-monorepo'
          assert payload['visibility'] == 'private'
          assert payload['initialization'] == 'readme'
          PY

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Create isolated Buildx builder
        run: |
          docker buildx create --name coordinator-builder --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Publish immutable and channel tags
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:main" \
            .
      - name: Record the cutover candidate without mutating deployment manifests
        shell: bash
        run: |
          {
            echo '## PostgreSQL runtime image published'
            echo
            printf 'Immutable candidate: %s:sha-%s\n' "$IMAGE_NAME" "$GITHUB_SHA"
            echo
            echo 'This workflow deliberately does **not** open an image-only deployment pull request. The checked-in Kubernetes base still describes the verified SQLite image/PVC contract. A coherent SQLite-to-PostgreSQL promotion must satisfy DEN-1073, including schema evidence, protected database credentials, state-retention/backfill decisions, manifest changes, live smoke tests, and rollback proof.'
          } >> "$GITHUB_STEP_SUMMARY"
