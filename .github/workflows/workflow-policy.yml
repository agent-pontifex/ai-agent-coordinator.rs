name: workflow-policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-policy.py'
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-policy.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinator-workflow-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce immutable/read-only/bounded workflow policy
        run: python3 scripts/check-workflow-policy.py
      - name: Actionlint every workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | sort -z)
          test "${#workflows[@]}" -gt 0
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            "${workflows[@]}"
