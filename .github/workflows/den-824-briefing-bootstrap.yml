name: DEN-824 briefing bootstrap

on:
  push:
    branches:
      - agent/den-824-daily-portfolio-briefing-core
    paths:
      - '.github/den-824-briefing-payload.tar.xz.b64'
      - '.github/den-824-briefing-payload.part-*'
      - '.github/workflows/den-824-briefing-bootstrap.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/den-824-briefing-payload.tar.xz.b64'
      - '.github/den-824-briefing-payload.part-*'
      - '.github/workflows/den-824-briefing-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-824-briefing-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-824-daily-portfolio-briefing-core
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify and extract the bounded implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/den-824-briefing-payload.part-* \
            | base64 --decode > /tmp/den-824-briefing.tar.xz
          printf '%s  %s\n' \
            '6b4716484ae348685d896d79844ccc22d2581dbc88e76ba27d30f660f452dd92' \
            /tmp/den-824-briefing.tar.xz | sha256sum --check --strict
          tar --list --xz --file /tmp/den-824-briefing.tar.xz | sort > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/daily-portfolio-briefing.yml
          docs/daily-portfolio-briefing.md
          tests/fixtures/daily_portfolio_briefing_input.json
          tests/fixtures/daily_portfolio_briefing_state.json
          tests/test_daily_portfolio_briefing.py
          tools/compose_daily_portfolio_briefing.py
          tools/enqueue_daily_portfolio_briefing.py
          EOF
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          tar --extract --xz --file /tmp/den-824-briefing.tar.xz
          chmod 0755 \
            tools/compose_daily_portfolio_briefing.py \
            tools/enqueue_daily_portfolio_briefing.py \
            tests/test_daily_portfolio_briefing.py
      - name: Validate target workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/daily-portfolio-briefing.yml
      - name: Compile and run positive and negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/compose_daily_portfolio_briefing.py \
            tools/enqueue_daily_portfolio_briefing.py \
            tests/test_daily_portfolio_briefing.py
          python -m unittest -v tests/test_daily_portfolio_briefing.py
      - name: Exercise plan, confirmed-state commit, and safe schedule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/daily-portfolio
          python tools/compose_daily_portfolio_briefing.py plan \
            --input tests/fixtures/daily_portfolio_briefing_input.json \
            --state tests/fixtures/daily_portfolio_briefing_state.json \
            --run-mode scheduled \
            --run-key daily-portfolio:scheduled:2026-07-31 \
            --scheduled-run-key daily-portfolio:scheduled:2026-07-31 \
            --scheduled-for 2026-07-31T13:00:00Z \
            --generated-at 2026-07-31T13:02:00Z \
            --timezone America/Chicago \
            --output-json /tmp/daily-portfolio/plan.json \
            --output-markdown /tmp/daily-portfolio/briefing.md
          python tools/compose_daily_portfolio_briefing.py commit \
            --plan /tmp/daily-portfolio/plan.json \
            --state tests/fixtures/daily_portfolio_briefing_state.json \
            --delivered-at 2026-07-31T13:05:00Z \
            --output-state /tmp/daily-portfolio/state.json
          python tools/enqueue_daily_portfolio_briefing.py \
            --endpoint https://coordinator.example.invalid \
            --now 2026-07-31T13:00:00Z \
            --dry-run > /tmp/daily-portfolio/enqueue.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/daily-portfolio/plan.json').read_text())
          state = json.loads(Path('/tmp/daily-portfolio/state.json').read_text())
          enqueue = json.loads(Path('/tmp/daily-portfolio/enqueue.json').read_text())
          markdown = Path('/tmp/daily-portfolio/briefing.md').read_text()
          assert plan['counts']['selected'] <= 12
          assert len(plan['priorities']) <= 3
          assert state['scheduled_baseline']['run_key'] == plan['run']['scheduled_run_key']
          assert enqueue['authorization'] == 'Bearer [REDACTED]'
          assert enqueue['idempotency_key'] == 'daily-portfolio:scheduled:2026-07-31'
          assert all(
              heading in markdown
              for heading in ('## Do today', '## Monitor', '## Ignore')
          )
          PY
      - name: Preserve only the reviewed implementation paths
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_agents_md.py --repo-root . --start-dir tools
          rm -f \
            .github/den-824-briefing-payload.tar.xz.b64 \
            .github/den-824-briefing-payload.part-* \
            .github/workflows/den-824-briefing-bootstrap.yml
          mapfile -t changed < <(git status --porcelain=v1 | cut -c4- | sort)
          for path in "${changed[@]}"; do
            case "$path" in
              .github/den-824-briefing-payload.tar.xz.b64|\
              .github/den-824-briefing-payload.part-*|\
              .github/workflows/den-824-briefing-bootstrap.yml|\
              .github/workflows/daily-portfolio-briefing.yml|\
              docs/daily-portfolio-briefing.md|\
              tests/fixtures/daily_portfolio_briefing_input.json|\
              tests/fixtures/daily_portfolio_briefing_state.json|\
              tests/test_daily_portfolio_briefing.py|\
              tools/compose_daily_portfolio_briefing.py|\
              tools/enqueue_daily_portfolio_briefing.py)
                ;;
              *)
                echo "unexpected changed path: $path" >&2
                exit 1
                ;;
            esac
          done
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-824: add deterministic daily portfolio briefing core'
          git push origin HEAD:agent/den-824-daily-portfolio-briefing-core
