name: run-worker-authority-runtime-pr

on:
  pull_request:
    paths:
      - ".github/workflows/apply-worker-authority-runtime-once.yml"
      - ".github/workflows/run-worker-authority-runtime-pr.yml"

permissions:
  contents: write

concurrency:
  group: run-worker-authority-runtime-pr
  cancel-in-progress: false

jobs:
  integrate-test-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/den-3138-runtime-worker-authorization
          fetch-depth: 0
          persist-credentials: true
      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Apply the reviewed exact-replacement program
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              ".github/workflows/apply-worker-authority-runtime-once.yml"
          ).read_text(encoding="utf-8")
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          program = dedent(source[start:end])
          exec(compile(program, "worker-authority-runtime", "exec"), {})
          PY
      - name: Canonically format and validate
        run: |
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all worker_authority
          git diff --check
      - name: Commit explicit runtime integration and remove both carriers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app.rs src/config.rs src/db.rs src/worker_authority.rs tests/job_queue.rs
          git rm -- \
            .github/workflows/apply-worker-authority-runtime-once.yml \
            .github/workflows/run-worker-authority-runtime-pr.yml
          git diff --cached --check
          git commit -m 'feat(DEN-3138): enforce protected worker authority at runtime'
          git push origin HEAD:refs/heads/feat/den-3138-runtime-worker-authorization
