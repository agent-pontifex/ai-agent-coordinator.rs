name: Repository fleet manifests

on:
  pull_request:
    paths:
      - repository-fleets/**
      - browser-tests/requirements-den877.txt
      - browser-tests/test_hypesiege_streempilot_audit_report.py
      - scripts/render_repository_fleet.py
      - scripts/test_render_repository_fleet.py
      - scripts/reconstruct_hypesiege_streempilot_fleet.py
      - scripts/publish_hypesiege_streempilot_fleet.py
      - scripts/render_hypesiege_streempilot_audit_report.py
      - scripts/test_publish_hypesiege_streempilot_fleet.py
      - scripts/test_hypesiege_streempilot_publisher_hardening.py
      - scripts/render_hypesiege_streempilot_plan.py
      - scripts/test_hypesiege_streempilot_plan_browser.py
      - docs/memebank-repository-bootstrap.md
      - docs/hypesiege-streempilot-repository-publication.md
      - docs/hypesiege-streempilot-publisher-hardening.md
      - .github/workflows/repository-fleets.yml
  push:
    branches: [main]
    paths:
      - repository-fleets/**
      - browser-tests/requirements-den877.txt
      - browser-tests/test_hypesiege_streempilot_audit_report.py
      - scripts/render_repository_fleet.py
      - scripts/test_render_repository_fleet.py
      - scripts/reconstruct_hypesiege_streempilot_fleet.py
      - scripts/publish_hypesiege_streempilot_fleet.py
      - scripts/render_hypesiege_streempilot_audit_report.py
      - scripts/test_publish_hypesiege_streempilot_fleet.py
      - scripts/test_hypesiege_streempilot_publisher_hardening.py
      - scripts/render_hypesiege_streempilot_plan.py
      - scripts/test_hypesiege_streempilot_plan_browser.py
      - docs/memebank-repository-bootstrap.md
      - docs/hypesiege-streempilot-repository-publication.md
      - docs/hypesiege-streempilot-publisher-hardening.md
      - .github/workflows/repository-fleets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate this workflow with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/repository-fleets.yml

  memebank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile repository-fleet tools
        run: |
          python -m py_compile \
            scripts/render_repository_fleet.py \
            scripts/test_render_repository_fleet.py
      - name: Run repository-fleet tests
        run: python -m unittest -v scripts/test_render_repository_fleet.py
      - name: Prove the checked-in MemeBank fleet remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_repository_fleet.py \
            --manifest repository-fleets/memebank.json \
            --mode plan > memebank-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("repository-fleets/memebank.json").read_text(encoding="utf-8")
          )
          plan = json.loads(Path("memebank-plan.json").read_text(encoding="utf-8"))
          assert plan["organization"] == "memebank"
          assert plan["tracking_issue"] == "DEN-1043"
          assert plan["ready_for_dry_run"] is False
          assert plan["ready_for_live"] is False
          assert len(plan["blockers"]) == 12
          assert ".github" in manifest["deferred_repositories"]
          assert all(
              repository["full_name"] != "memebank/.github"
              for repository in plan["repositories"]
          )
          assert plan["repositories"][0]["full_name"] == "memebank/mb-interfaces"
          assert plan["repositories"][-1]["full_name"] == "memebank/memebank-monorepo"
          PY

  hypesiege-streempilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate the fleet workflow
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/repository-fleets.yml
      - name: Compile deterministic fleet tools
        run: |
          python -m py_compile \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py \
            scripts/render_hypesiege_streempilot_plan.py \
            scripts/test_hypesiege_streempilot_plan_browser.py
      - name: Reconstruct, compare, and preflight the sealed fleet
        run: |
          python -m unittest -v \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py
      - name: Render representative network-free plans
        shell: bash
        env:
          GITHUB_REPOSITORY_ADMIN_TOKEN: ""
        run: |
          set -euo pipefail
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository hypesiege/hypesiege-api-server.rs \
            > hypesiege-plan.json
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository streempilot/streempilot-monorepo \
            > streempilot-plan.json
          python scripts/render_hypesiege_streempilot_plan.py \
            --output operator-plan.html
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import subprocess
          import sys

          hypesiege = json.loads(Path("hypesiege-plan.json").read_text())
          streempilot = json.loads(Path("streempilot-plan.json").read_text())
          assert hypesiege == {
              "mode": "plan",
              "repository": "hypesiege/hypesiege-api-server.rs",
              "commit": "8b1b00ecc3ef421d03db9f9231a703bfbec6df9f",
              "visibility": "public",
              "remote": "https://github.com/hypesiege/hypesiege-api-server.rs.git",
              "files": 25,
              "gitlinks": 0,
          }
          assert streempilot == {
              "mode": "plan",
              "repository": "streempilot/streempilot-monorepo",
              "commit": "e1527280d6a21f49fcdc08dc9efc00bedfbf718c",
              "visibility": "public",
              "remote": "https://github.com/streempilot/streempilot-monorepo.git",
              "files": 43,
              "gitlinks": 16,
          }
          html = Path("operator-plan.html").read_text(encoding="utf-8")
          assert html.count("data-repository=") == 32
          assert "<script" not in html.casefold()
          assert "<form" not in html.casefold()
          assert "https://" not in html
          PY
      - name: Reject conflict markers, live credential wiring, and mutable actions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            repository-fleets/hypesiege-streempilot* \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py \
            scripts/render_hypesiege_streempilot_plan.py \
            scripts/test_hypesiege_streempilot_plan_browser.py; then
            echo 'conflict markers found' >&2
            exit 1
          fi
          credential_pattern='HYPESIEGE_REPOSITORY_ADMIN_''TOKEN|STREEMPILOT_REPOSITORY_ADMIN_''TOKEN'
          if grep -RInE "$credential_pattern" \
            .github/workflows/repository-fleets.yml \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py \
            scripts/render_hypesiege_streempilot_plan.py \
            scripts/test_hypesiege_streempilot_plan_browser.py; then
            echo 'live organization credentials must not be wired into validation CI' >&2
            exit 1
          fi
          if grep -nE '\$\{\{[[:space:]]*secrets\.' \
            .github/workflows/repository-fleets.yml; then
            echo 'validation CI must not consume repository secrets' >&2
            exit 1
          fi
          if grep -nE '^[[:space:]]+[A-Za-z-]+:[[:space:]]*write([[:space:]]|$)' \
            .github/workflows/repository-fleets.yml; then
            echo 'validation CI must remain read-only' >&2
            exit 1
          fi
          python - <<'PY'
          import pathlib
          import re

          workflow = pathlib.Path(
              ".github/workflows/repository-fleets.yml"
          ).read_text(encoding="utf-8")
          references = re.findall(r"uses:\s*[^@\s]+@([^\s#]+)", workflow)
          assert references
          assert all(re.fullmatch(r"[0-9a-f]{40}", ref) for ref in references), references
          PY

  hypesiege-streempilot-browser:
    needs: hypesiege-streempilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      BROWSER_ARTIFACT_DIR: browser-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Chrome for Testing and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@73954683cc80eced513145a42b668b9b91f753c3 # v2.1.2
        with:
          chrome-version: 151.0.7922.71
          install-dependencies: true
          install-chromedriver: true
      - name: Exercise the read-only operator plan in a real browser
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          python -m unittest -v \
            scripts/test_hypesiege_streempilot_plan_browser.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypesiege-streempilot-browser-evidence
          path: browser-artifacts
          if-no-files-found: warn
          retention-days: 7
