name: Weekly job opportunity digest

on:
  pull_request:
    paths:
      - .github/workflows/weekly-job-opportunity-digest.yml
      - tools/enqueue_weekly_job_digest.py
      - tests/test_weekly_job_digest.py
      - docs/weekly-job-opportunity-digest.md
  push:
    branches: [main]
    paths:
      - .github/workflows/weekly-job-opportunity-digest.yml
      - tools/enqueue_weekly_job_digest.py
      - tests/test_weekly_job_digest.py
      - docs/weekly-job-opportunity-digest.md
  schedule:
    # 09:17 America/New_York in daylight and standard time. The script
    # accepts only the invocation whose converted local time is exactly 09:17.
    - cron: '17 13 * * 1'
    - cron: '17 14 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, or enqueue the current ISO-week job.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - enqueue

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile scheduler sources
        run: >-
          python3 -m py_compile
          tools/enqueue_weekly_job_digest.py
          tests/test_weekly_job_digest.py
      - name: Run scheduler tests
        run: >-
          python3 -m unittest discover
          -s tests
          -p 'test_weekly_job_digest.py'
          -v
      - name: Verify deterministic profile-redacted plan
        env:
          AI_AGENT_JOB_PROFILE_JSON: >-
            {"target_roles":["Synthetic Platform Engineer"],"skills":["Synthetic distributed systems"],"work_authorization":{"review_required":true},"preferred_arrangement":["Synthetic remote"],"compensation":{"review_required":true},"test_marker":"private-ci-profile"}
        run: >-
          python3 tools/enqueue_weekly_job_digest.py
          --endpoint https://coordinator.example.invalid
          --now 2026-07-27T13:17:00Z
          --dry-run
          > /tmp/weekly-job-plan.json
      - name: Assert discovery-only redacted plan
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path("/tmp/weekly-job-plan.json").read_text()
          plan = json.loads(raw)
          assert plan["status"] == "dry_run"
          assert plan["authorization"] == "Bearer [REDACTED]"
          assert "private-ci-profile" not in raw
          request = plan["request"]
          assert request["task_type"] == "job_opportunity_digest"
          payload = request["payload"]
          assert payload["candidate_profile"] == {"redacted": True}
          assert payload["linear"]["canonical_issue"] == "DEN-826"
          assert payload["linear"]["browser_application_issue"] == "DEN-256"
          assert "submit_application" in payload["forbidden_actions"]
          assert "send_email" in payload["forbidden_actions"]
          assert "submit_application" not in payload["allowed_actions"]
          assert payload["volume_boundary"]["requested_range"] == {
              "minimum": 150,
              "maximum": 350,
          }
          assert payload["volume_boundary"]["automatic_submission"] is False
          PY

  enqueue:
    needs: validate
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'enqueue')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: weekly-job-digest
    env:
      AI_AGENT_COORDINATOR_URL: ${{ vars.AI_AGENT_COORDINATOR_URL }}
      AI_AGENT_COORDINATOR_API_TOKEN: ${{ secrets.AI_AGENT_COORDINATOR_API_TOKEN }}
      AI_AGENT_JOB_PROFILE_JSON: ${{ secrets.AI_AGENT_JOB_PROFILE_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require protected coordinator configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AI_AGENT_COORDINATOR_URL}"
          test -n "${AI_AGENT_COORDINATOR_API_TOKEN}"
          test -n "${AI_AGENT_JOB_PROFILE_JSON}"
      - name: Enqueue one discovery-only job
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            args+=(--force)
          fi
          python3 tools/enqueue_weekly_job_digest.py "${args[@]}"
