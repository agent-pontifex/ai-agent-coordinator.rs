apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-coordinator
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator
    app.kubernetes.io/part-of: oresoftware-agent-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-agent-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-agent-coordinator
        app.kubernetes.io/part-of: oresoftware-agent-platform
    spec:
      serviceAccountName: ai-agent-coordinator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: ghcr.io/oresoftware/ai-agent-coordinator:sha-41c2d80bbd4412df3ca2d9448401c19fa23985a3
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/coordinator.yaml
            - --json-logs
          env:
            - name: GITHUB_REPOSITORY_ADMIN_ENABLED
              value: "false"
            - name: GITHUB_REPOSITORY_ADMIN_ALLOWED_ORGS
              value: declarative-migrations
            - name: GITHUB_API_BASE_URL
              value: https://api.github.com
            - name: GITHUB_API_ALLOWED_HOSTS
              value: api.github.com
            - name: GITHUB_API_VERSION
              value: "2022-11-28"
            - name: GITHUB_API_USER_AGENT
              value: ai-agent-coordinator
            - name: RUST_LOG
              value: ai_agent_coordinator=info,tower_http=info
          envFrom:
            - configMapRef:
                name: ai-agent-coordinator-telemetry
            - secretRef:
                name: ai-agent-coordinator-core
            - secretRef:
                name: ai-agent-coordinator-telemetry
            - secretRef:
                name: ai-agent-coordinator-admin
                optional: true
            - secretRef:
                name: ai-agent-coordinator-providers
                optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-agent-coordinator-data
      terminationGracePeriodSeconds: 30
