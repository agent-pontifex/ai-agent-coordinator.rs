apiVersion: batch/v1
kind: Job
metadata:
  name: meta-agent-control-plane-repository-bootstrap-20260731
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator
    app.kubernetes.io/component: repository-bootstrap
    app.kubernetes.io/part-of: oresoftware-agent-platform
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-agent-coordinator
        app.kubernetes.io/component: repository-bootstrap
        app.kubernetes.io/part-of: oresoftware-agent-platform
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-repository
          image: curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: GITHUB_REPOSITORY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-agent-coordinator-admin
                  key: GITHUB_REPOSITORY_ADMIN_TOKEN
          command:
            - /bin/sh
            - -ec
          args:
            - |
              token="${GITHUB_REPOSITORY_ADMIN_TOKEN:-}"
              test -n "$token" || {
                echo 'repository-bootstrap status=failed reason=missing-admin-token' >&2
                exit 64
              }
              case "$token" in
                *[[:space:]]*)
                  echo 'repository-bootstrap status=failed reason=invalid-admin-token-shape' >&2
                  exit 64
                  ;;
              esac

              api='https://api.github.com'
              accept='application/vnd.github+json'
              version='2022-11-28'
              target='meta-agents-demo/meta-agent-control-plane.rs'

              user_code="$(curl --silent --show-error \
                --output /tmp/user.json \
                --write-out '%{http_code}' \
                --header "Accept: ${accept}" \
                --header "Authorization: Bearer ${token}" \
                --header "X-GitHub-Api-Version: ${version}" \
                --header 'User-Agent: ai-agent-coordinator-repository-bootstrap' \
                "${api}/user")"
              test "$user_code" = 200 || {
                echo "repository-bootstrap status=failed stage=identity http=${user_code}" >&2
                exit 65
              }
              grep -Eq '"login"[[:space:]]*:[[:space:]]*"ORESoftware"' /tmp/user.json || {
                echo 'repository-bootstrap status=failed stage=identity reason=unexpected-login' >&2
                exit 65
              }

              membership_code="$(curl --silent --show-error \
                --output /tmp/membership.json \
                --write-out '%{http_code}' \
                --header "Accept: ${accept}" \
                --header "Authorization: Bearer ${token}" \
                --header "X-GitHub-Api-Version: ${version}" \
                --header 'User-Agent: ai-agent-coordinator-repository-bootstrap' \
                "${api}/user/memberships/orgs/meta-agents-demo")"
              test "$membership_code" = 200 || {
                echo "repository-bootstrap status=failed stage=membership http=${membership_code}" >&2
                exit 65
              }
              grep -Eq '"role"[[:space:]]*:[[:space:]]*"admin"' /tmp/membership.json \
                && grep -Eq '"state"[[:space:]]*:[[:space:]]*"active"' /tmp/membership.json || {
                  echo 'repository-bootstrap status=failed stage=membership reason=not-active-admin' >&2
                  exit 65
                }

              repository_code="$(curl --silent --show-error \
                --output /tmp/repository.json \
                --write-out '%{http_code}' \
                --header "Accept: ${accept}" \
                --header "Authorization: Bearer ${token}" \
                --header "X-GitHub-Api-Version: ${version}" \
                --header 'User-Agent: ai-agent-coordinator-repository-bootstrap' \
                "${api}/repos/${target}")"

              case "$repository_code" in
                200)
                  status=existing
                  ;;
                404)
                  repository_code="$(curl --silent --show-error \
                    --output /tmp/repository.json \
                    --write-out '%{http_code}' \
                    --request POST \
                    --header "Accept: ${accept}" \
                    --header "Authorization: Bearer ${token}" \
                    --header "X-GitHub-Api-Version: ${version}" \
                    --header 'User-Agent: ai-agent-coordinator-repository-bootstrap' \
                    --header 'Content-Type: application/json' \
                    --data '{"name":"meta-agent-control-plane.rs","description":"Single-binary Rust control plane and Leptos UI for observable AI-agent progress, reflection, and bounded learning.","visibility":"public","auto_init":true,"has_issues":true,"has_projects":false,"has_wiki":false,"allow_squash_merge":true,"allow_merge_commit":true,"allow_rebase_merge":false}' \
                    "${api}/orgs/meta-agents-demo/repos")"
                  test "$repository_code" = 201 || {
                    echo "repository-bootstrap status=failed stage=create http=${repository_code}" >&2
                    exit 66
                  }
                  status=created
                  ;;
                *)
                  echo "repository-bootstrap status=failed stage=lookup http=${repository_code}" >&2
                  exit 66
                  ;;
              esac

              grep -Eq '"full_name"[[:space:]]*:[[:space:]]*"meta-agents-demo/meta-agent-control-plane.rs"' /tmp/repository.json \
                && grep -Eq '"private"[[:space:]]*:[[:space:]]*false' /tmp/repository.json || {
                  echo 'repository-bootstrap status=failed stage=verify reason=unexpected-repository' >&2
                  exit 67
                }
              echo "repository-bootstrap status=${status} target=${target}"
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
