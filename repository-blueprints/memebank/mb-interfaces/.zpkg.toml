[package]
org = "memebank"
name = "mb-interfaces"
version = "0.1.0"
description = "Versioned MemeBank API, event, manifest, storage, search, sync, and image-intelligence contracts"
license = "Apache-2.0"
keywords = ["contracts", "openapi", "json-schema", "memebank", "multimodal"]

[package.repository]
vcs = "git"
url = "https://github.com/memebank/mb-interfaces"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "make agent-check"
exclude = [
  ".artifacts/**",
  "generated/**",
]

[build]
command = "make agent-check"
outputs = [
  "openapi/v1/openapi.json",
  "schemas/v1",
  "fixtures/v1",
  "compatibility/v1-baseline.json",
]

[install]
adapter = "none"

[scripts]
test = "make agent-check"
validate = "python3 scripts/validate_contracts.py"
