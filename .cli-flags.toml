# Non-secret command-line flags for ai-agent-coordinator.
#
# This is the canonical CLI-to-environment contract used by flags-2-env.
# Credentials, provider keys, webhook secrets, repository-administration
# tokens, and Linear credentials are deliberately environment/secret-manager
# only and are never accepted as command-line values.

[help]
url = "https://github.com/ORESoftware/ai-agent-coordinator.rs/blob/main/docs/cli-flags.md"
columns = ["options", "env", "type", "default", "description"]

[parse]
require_equals = true
stop_at_first_positional = false
unknown_options_env = "FLAGS2ENV_UNKNOWN_OPTIONS"
errors_env = "FLAGS2ENV_PARSE_ERRORS"
allow_unknown = false

[env]
ignore = ["COORDINATOR_API_TOKEN", "AI_AGENT_COORDINATOR_DATABASE_URL", "DATABASE_URL", "GITHUB_WEBHOOK_SECRET", "GITHUB_REPOSITORY_ADMIN_TOKEN", "LINEAR_API_TOKEN", "EMAIL_ATTENTION_NOTIFICATION_TOKEN", "MISTRAL_API_KEY", "OPENROUTER_API_KEY", "OPENAI_API_KEY"]

[flags.config]
env = "COORDINATOR_CONFIG"
aliases = ["config", "config-path"]
short = "c"
type = "string"
default = "coordinator.yaml"
help = "Path to the coordinator YAML configuration file."

[flags.json-logs]
env = "COORDINATOR_JSON_LOGS"
aliases = ["json-logs"]
type = "bool"
default = "false"
help = "Emit structured JSON logs."

[flags.linear-delivery-enabled]
env = "LINEAR_DELIVERY_ENABLED"
aliases = ["linear-delivery-enabled"]
type = "bool"
default = "false"
help = "Enable the protected Linear delivery adapter."

[flags.linear-delivery-dry-run]
env = "LINEAR_DELIVERY_DRY_RUN"
aliases = ["linear-delivery-dry-run"]
type = "bool"
default = "true"
help = "Plan Linear mutations without consuming or mutating queued jobs."

[flags.linear-api-url]
env = "LINEAR_API_URL"
aliases = ["linear-api-url"]
type = "string"
default = "https://api.linear.app/graphql"
help = "Linear GraphQL endpoint; HTTPS is required except loopback HTTP in tests."

[flags.linear-api-auth-scheme]
env = "LINEAR_API_AUTH_SCHEME"
aliases = ["linear-api-auth-scheme"]
type = "string"
default = "api_key"
help = "Linear authentication scheme: api_key or bearer."

[flags.linear-team-key]
env = "LINEAR_TEAM_KEY"
aliases = ["linear-team-key"]
type = "string"
default = "DEN"
help = "Exact Linear team key allowed for commit delivery."

[flags.linear-project-names]
env = "LINEAR_PROJECT_NAMES"
aliases = ["linear-project-names"]
type = "string"
help = "Exact organization=Linear-project-name mapping."

[flags.linear-completed-state-id]
env = "LINEAR_COMPLETED_STATE_ID"
aliases = ["linear-completed-state-id"]
type = "string"
help = "Optional default completed-state UUID for closing directives."

[flags.linear-completed-state-ids]
env = "LINEAR_COMPLETED_STATE_IDS"
aliases = ["linear-completed-state-ids"]
type = "string"
help = "Optional organization=completed-state-UUID mapping."

[flags.linear-request-timeout-ms]
env = "LINEAR_REQUEST_TIMEOUT_MS"
aliases = ["linear-request-timeout-ms"]
type = "integer"
default = "10000"
help = "Linear HTTP request timeout in milliseconds."

[flags.linear-max-response-bytes]
env = "LINEAR_MAX_RESPONSE_BYTES"
aliases = ["linear-max-response-bytes"]
type = "integer"
default = "262144"
help = "Maximum Linear HTTP response bytes."

[flags.linear-max-retries]
env = "LINEAR_MAX_RETRIES"
aliases = ["linear-max-retries"]
type = "integer"
default = "3"
help = "Maximum retry attempts for rate limits and transient server failures."

[flags.linear-min-org-interval-ms]
env = "LINEAR_MIN_ORG_INTERVAL_MS"
aliases = ["linear-min-org-interval-ms"]
type = "integer"
default = "100"
help = "Minimum delay between Linear requests for one GitHub organization."

[flags.email-attention-enabled]
env = "EMAIL_ATTENTION_ENABLED"
aliases = ["email-attention-enabled"]
type = "bool"
default = "false"
help = "Enable the fail-closed read-only Gmail and Outlook attention scheduler."

[flags.email-attention-timezone]
env = "EMAIL_ATTENTION_TIMEZONE"
aliases = ["email-attention-timezone"]
type = "string"
default = "America/New_York"
help = "Schedule timezone: America/New_York, UTC, or a fixed offset such as -05:00."

[flags.email-attention-weekdays]
env = "EMAIL_ATTENTION_WEEKDAYS"
aliases = ["email-attention-weekdays"]
type = "string"
default = "mon,tue,wed,thu,fri"
help = "Comma-separated schedule weekdays, daily, or *."

[flags.email-attention-local-hour]
env = "EMAIL_ATTENTION_LOCAL_HOUR"
aliases = ["email-attention-local-hour"]
type = "integer"
default = "9"
help = "Local schedule hour from 0 through 23."

[flags.email-attention-local-minute]
env = "EMAIL_ATTENTION_LOCAL_MINUTE"
aliases = ["email-attention-local-minute"]
type = "integer"
default = "0"
help = "Local schedule minute from 0 through 59."

[flags.email-attention-notification-url]
env = "EMAIL_ATTENTION_NOTIFICATION_URL"
aliases = ["email-attention-notification-url"]
type = "string"
help = "HTTPS endpoint for the reviewed user-notification adapter."

[flags.email-attention-notification-token-env]
env = "EMAIL_ATTENTION_NOTIFICATION_TOKEN_ENV"
aliases = ["email-attention-notification-token-env"]
type = "string"
default = "EMAIL_ATTENTION_NOTIFICATION_TOKEN"
help = "Name of the environment variable containing the notification bearer token."

[flags.email-attention-request-timeout-ms]
env = "EMAIL_ATTENTION_REQUEST_TIMEOUT_MS"
aliases = ["email-attention-request-timeout-ms"]
type = "integer"
default = "15000"
help = "Mailbox connector and notification request timeout in milliseconds."

[flags.email-attention-max-response-bytes]
env = "EMAIL_ATTENTION_MAX_RESPONSE_BYTES"
aliases = ["email-attention-max-response-bytes"]
type = "integer"
default = "524288"
help = "Maximum mailbox connector response bytes."

[flags.email-attention-max-messages-per-source]
env = "EMAIL_ATTENTION_MAX_MESSAGES_PER_SOURCE"
aliases = ["email-attention-max-messages-per-source"]
type = "integer"
default = "200"
help = "Maximum messages requested from each source per scan."

[flags.email-attention-max-notifications-per-run]
env = "EMAIL_ATTENTION_MAX_NOTIFICATIONS_PER_RUN"
aliases = ["email-attention-max-notifications-per-run"]
type = "integer"
default = "50"
help = "Maximum attention items included in one notification."

[flags.email-attention-reminder-interval-hours]
env = "EMAIL_ATTENTION_REMINDER_INTERVAL_HOURS"
aliases = ["email-attention-reminder-interval-hours"]
type = "integer"
default = "24"
help = "Minimum interval for unchanged urgent-item reminders."

[flags.email-attention-lease-seconds]
env = "EMAIL_ATTENTION_LEASE_SECONDS"
aliases = ["email-attention-lease-seconds"]
type = "integer"
default = "3600"
help = "Cross-replica scheduled-run lease duration in seconds."

[flags.email-attention-pending-retry-limit]
env = "EMAIL_ATTENTION_PENDING_RETRY_LIMIT"
aliases = ["email-attention-pending-retry-limit"]
type = "integer"
default = "20"
help = "Maximum pending notification deliveries retried per scheduled run."

[flags.email-attention-user-agent]
env = "EMAIL_ATTENTION_USER_AGENT"
aliases = ["email-attention-user-agent"]
type = "string"
default = "ai-agent-coordinator-email-attention"
help = "User-Agent sent to mailbox connector and notification adapters."

[flags.repository-admin-enabled]
env = "GITHUB_REPOSITORY_ADMIN_ENABLED"
aliases = ["repository-admin-enabled", "github-repository-admin-enabled"]
type = "bool"
default = "false"
help = "Enable the fail-closed GitHub repository administration adapter after a reviewed dry run."

[flags.repository-admin-allowed-orgs]
env = "GITHUB_REPOSITORY_ADMIN_ALLOWED_ORGS"
aliases = ["repository-admin-allowed-orgs", "github-repository-admin-allowed-orgs"]
type = "string"
help = "Comma-separated exact organization allowlist for repository administration."

[flags.github-api-base-url]
env = "GITHUB_API_BASE_URL"
aliases = ["github-api-base-url"]
type = "string"
default = "https://api.github.com"
help = "GitHub API base URL; HTTPS is required except loopback HTTP in tests."

[flags.github-api-allowed-hosts]
env = "GITHUB_API_ALLOWED_HOSTS"
aliases = ["github-api-allowed-hosts"]
type = "string"
default = "api.github.com"
help = "Comma-separated exact HTTPS hosts allowed to receive the GitHub administration credential."

[flags.github-api-version]
env = "GITHUB_API_VERSION"
aliases = ["github-api-version"]
type = "string"
default = "2022-11-28"
help = "GitHub REST API version header value."

[flags.github-api-user-agent]
env = "GITHUB_API_USER_AGENT"
aliases = ["github-api-user-agent"]
type = "string"
default = "ai-agent-coordinator"
help = "User-Agent sent by the GitHub administration adapter."

[flags.rust-log]
env = "RUST_LOG"
aliases = ["rust-log", "log-filter"]
type = "string"
default = "ai_agent_coordinator=info,tower_http=info"
help = "Tracing filter used by the coordinator process."
